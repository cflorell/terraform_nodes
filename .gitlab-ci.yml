stages:
  - secret-detection
  - validate
  - test
  - post-test
  - plan
  - apply

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/SAST-IaC.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Default to run on k8s runner instead of GitLab.com shared runners.
default:
  tags:
    - k8s

variables:
  SECRET_DETECTION_ENABLED: 'true'
  TRIVY_CACHE_DIR: .trivycache
  # Pinned rather than resolved at run time - bump deliberately to upgrade.
  TERRAFORM_PLAN_APPLY_VERSION: "1.15.8"
  SOPS_VERSION: "v3.13.2"

# Files that actually affect `terraform plan`/`apply` output, per Terraform
# project root. Referenced via YAML anchor from each project's validate/plan/
# apply rules so those jobs (and the apply manual gate) aren't created at all
# for commits that don't touch them (e.g. docs-only changes) - keeps the
# pipeline (and its badge) green instead of parked on "manual".
#
# Splitting these is what keeps the two projects independent: an Authentik
# object change never triggers an infrastructure plan, and an unreachable
# Authentik never blocks one. scripts/** appears in both because
# link-private-files.sh and decrypt-private-files.sh feed every project.
.infra_changes: &infra_changes
  - "infra/**/*"
  - "scripts/**/*"

.authentik_changes: &authentik_changes
  - "authentik/**/*"
  - "scripts/**/*"

sast:
  stage: test

secret_detection:
  stage: secret-detection

trufflehog:
  stage: secret-detection
  image:
    name: trufflesecurity/trufflehog:latest
    entrypoint: [""]
  script:
    - trufflehog git file://. --fail --json > trufflehog-report.json
  artifacts:
    when: always
    paths:
      - trufflehog-report.json
    expire_in: 1 week

trivy-iac:
  stage: test
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  cache:
    key: trivy-cache
    paths:
      - .trivycache/
  script:
    - trivy --version
    - trivy config --format json --output trivy-iac-report.json .
    - trivy config --format table --exit-code 1 .
  artifacts:
    when: always
    paths:
      - trivy-iac-report.json
    expire_in: 1 week


parse-sast-results:
  stage: post-test
  image: alpine:latest
  before_script:
    - apk add --no-cache jq
  script:
    - echo "=== SECRET DETECTION RESULTS ==="
    - |
      if [ -f "gl-secret-detection-report.json" ]; then
        jq -r '.vulnerabilities[] | "Severity: [\(.severity)] | Category: \(.category) \nDescription: \(.message) \nLocation: \(.location.file):\(.location.start_line)\n-----------------------------------"' gl-sast-report.json
      else
        echo "gl-secret-detection-report.json not found."
      fi
    - echo "=== SAST RESULTS ==="
    - |
      if [ -f "gl-sast-report.json" ]; then
        jq -r '.vulnerabilities[] | "Severity: [\(.severity)] | Category: \(.category) \nDescription: \(.message) \nLocation: \(.location.file):\(.location.start_line)\n-----------------------------------"' gl-sast-report.json
      else
        echo "gl-sast-report.json not found."
      fi

# --- Terraform remote state + plan/apply -------------------------------------
# State lives in GitLab's managed Terraform state (Operate > Terraform states),
# accessed here with the ephemeral CI job token. terraform.tfvars itself comes
# from the private secrets repo: it's cloned with the job token, symlinked in
# via scripts/link-private-files.sh, then decrypted from its SOPS/age-encrypted
# form with scripts/decrypt-private-files.sh (see .tfvars_setup below).

# TF_STATE_NAME is deliberately not defaulted here: each project sets its own
# ("homelab" for infra/, "authentik" for authentik/) so a job can never fall
# back to another project's state by omission.
.terraform_remote_state:
  variables:
    TF_HTTP_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}
    TF_HTTP_LOCK_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock
    TF_HTTP_UNLOCK_ADDRESS: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}/lock
    TF_HTTP_LOCK_METHOD: POST
    TF_HTTP_UNLOCK_METHOD: DELETE
    TF_HTTP_USERNAME: gitlab-ci-token
    TF_HTTP_PASSWORD: ${CI_JOB_TOKEN}
    TF_HTTP_RETRY_WAIT_MIN: "5"
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

# Shared by terraform_plan/terraform_apply: installs the tools the k8s
# executor's plain alpine then clones the private secrets repo with
# the job token, links terraform.tfvars.sops in via link-private-files.sh,
# and decrypts it with sops (needs SOPS_AGE_KEY set as a masked CI/CD
# variable) into a plaintext terraform.tfvars for the job.
.tfvars_setup:
  image: alpine:latest
  before_script:
    - apk add --no-cache bash git jq curl unzip
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TERRAFORM_PLAN_APPLY_VERSION}/terraform_${TERRAFORM_PLAN_APPLY_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
    - unzip -q /tmp/terraform.zip -d /usr/local/bin
    - chmod 755 /usr/local/bin/terraform
    - curl -fsSL "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64" -o /usr/local/bin/sops
    - chmod 755 /usr/local/bin/sops
    - git clone "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/cf_homelab/secrets.git"
    - ./scripts/link-private-files.sh --secrets-dir secrets
    - ./scripts/decrypt-private-files.sh

# Formatting is checked once for the whole repo rather than per project, so a
# stray .tf outside infra/ and authentik/ is still caught.
terraform_fmt:
  stage: validate
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *infra_changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *authentik_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *infra_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *authentik_changes
  script:
    - terraform fmt -check -recursive -diff

terraform_validate_infra:
  stage: validate
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *infra_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *infra_changes
  script:
    - cd infra
    - terraform init -backend=false
    - terraform validate

terraform_validate_authentik:
  stage: validate
  image:
    name: hashicorp/terraform:1.16
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *authentik_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *authentik_changes
  script:
    - cd authentik
    - terraform init -backend=false
    - terraform validate

# Runs on the k8s-executor runner: it needs network access to the Proxmox
# endpoints (verified reachable from pods), terraform/jq/sops installed by
# .tfvars_setup above.
terraform_plan_infra:
  stage: plan
  extends:
    - .terraform_remote_state
    - .tfvars_setup
  tags:
    - k8s
  variables:
    TF_STATE_NAME: homelab
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *infra_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *infra_changes
  script:
    - terraform version
    - cd infra
    - terraform init
    - terraform plan -lock=false -var-file="terraform.tfvars" -out=homelab.tfplan
    - |
      terraform show -json homelab.tfplan | jq -r '([.resource_changes[]?.change.actions?] | flatten) | {create: (map(select(.=="create")) | length), update: (map(select(.=="update")) | length), delete: (map(select(.=="delete")) | length)}' > tfplan.json
  artifacts:
    reports:
      terraform: infra/tfplan.json
    expire_in: 1 week

terraform_apply_infra:
  stage: apply
  extends:
    - .terraform_remote_state
    - .tfvars_setup
  tags:
    - k8s
  variables:
    TF_STATE_NAME: homelab
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *infra_changes
      when: manual
  script:
    - cd infra
    - terraform init
    - terraform apply -auto-approve -var-file="terraform.tfvars"
  environment:
    name: homelab

# The authentik project configures a running service rather than provisioning
# it, so these jobs need Authentik reachable at var.authentik_url and its
# secrets present in the private repo. Both arrive with the Authentik
# Terraform configuration itself; until then, set the project variable
# AUTHENTIK_TF_ENABLED to "true" to switch them on.
terraform_plan_authentik:
  stage: plan
  extends:
    - .terraform_remote_state
    - .tfvars_setup
  tags:
    - k8s
  variables:
    TF_STATE_NAME: authentik
  rules:
    - if: $AUTHENTIK_TF_ENABLED != "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *authentik_changes
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *authentik_changes
  script:
    - terraform version
    - cd authentik
    - terraform init
    - terraform plan -lock=false -var-file="terraform.tfvars" -out=authentik.tfplan
    - |
      terraform show -json authentik.tfplan | jq -r '([.resource_changes[]?.change.actions?] | flatten) | {create: (map(select(.=="create")) | length), update: (map(select(.=="update")) | length), delete: (map(select(.=="delete")) | length)}' > tfplan.json
  artifacts:
    reports:
      terraform: authentik/tfplan.json
    expire_in: 1 week

terraform_apply_authentik:
  stage: apply
  extends:
    - .terraform_remote_state
    - .tfvars_setup
  tags:
    - k8s
  variables:
    TF_STATE_NAME: authentik
  rules:
    - if: $AUTHENTIK_TF_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      changes: *authentik_changes
      when: manual
  script:
    - cd authentik
    - terraform init
    - terraform apply -auto-approve -var-file="terraform.tfvars"
  environment:
    name: authentik
